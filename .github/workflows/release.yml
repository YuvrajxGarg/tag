# Builds Tag for macOS and Windows when a version tag (v1.2.3) is
# pushed, and attaches the apps to that GitHub release.
# What people download (installer/ builds these):
#   macOS   -> Tag.dmg          (drag to Applications)
#   Windows -> Tag-Setup.exe    (setup wizard)
# What installed copies update from (keep these: every existing install uses them):
#   macOS   -> Tag-mac.zip      + .sha256
#   Windows -> Tag-windows.zip  + .sha256
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build, e.g. v1.2.0
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The release stays a draft until both apps are attached, so the updater never
      # sees a published release that's missing a platform's download.
      - name: Create the draft release if it doesn't exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "Tag ${TAG#v}" --generate-notes --verify-tag --draft

  build:
    needs: release
    strategy:
      matrix:
        os: [macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set version from the tag
        run: echo "${TAG#v}" > VERSION
      - run: pip install pyinstaller certifi -r requirements.txt
      - run: python -m unittest discover tests
      - run: pyinstaller --noconfirm --log-level WARN Tag.spec
      - name: Smoke-test the built app
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then python tests/smoke_app.py dist/Tag.app/Contents/MacOS/Tag
          else python tests/smoke_app.py dist/Tag/Tag.exe; fi
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          cd dist
          ditto -c -k --keepParent Tag.app Tag-mac.zip
          shasum -a 256 Tag-mac.zip > Tag-mac.zip.sha256
          cat Tag-mac.zip.sha256
      - name: Disk image (macOS)
        if: runner.os == 'macOS'
        run: installer/build_mac.sh Tag && installer/test_mac.sh Tag
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd dist
          Compress-Archive -Path Tag -DestinationPath Tag-windows.zip
          $h = (Get-FileHash Tag-windows.zip -Algorithm SHA256).Hash.ToLower()
          "$h  Tag-windows.zip" | Out-File -Encoding ascii -NoNewline Tag-windows.zip.sha256
          Get-Content Tag-windows.zip.sha256
      - name: Setup wizard (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          installer/build_windows.ps1 -App Tag -Version $env:TAG -Url https://github.com/YuvrajxGarg/tag
          installer/test_windows.ps1 -App Tag -Smoke "python tests/smoke_app.py"
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then files="dist/Tag-mac.zip* dist/Tag.dmg*"
          else files="dist/Tag-windows.zip* dist/Tag-Setup.exe*"; fi
          gh release upload "$TAG" $files --clobber

  publish:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Publish once both apps are attached
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          assets=$(gh release view "$TAG" --json assets -q '.assets[].name')
          echo "$assets"
          for a in Tag-mac.zip Tag-mac.zip.sha256 Tag-windows.zip Tag-windows.zip.sha256 Tag.dmg Tag-Setup.exe; do
            echo "$assets" | grep -qx "$a" || { echo "missing $a, leaving the release as a draft"; exit 1; }
          done
          gh release edit "$TAG" --draft=false --latest
